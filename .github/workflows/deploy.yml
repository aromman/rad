name: Deploy rad

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-rad
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/public_html/rad/' }}
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config/config.local.php
            **/README.md
            app/models/constantes.php

      # El hosting bloquea el trafico HTTPS entrante desde las IPs de
      # datacenter de GitHub Actions, asi que este intento es best-effort:
      # no falla el deploy si no puede conectar. La aplicacion real de
      # las migraciones queda a cargo de un cron job en el propio hosting
      # que corre db/migrate.php por CLI (ver README del proyecto).
      - name: Try to trigger DB migrations (best-effort)
        continue-on-error: true
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "APP_URL no configurada, se omite el intento por HTTP (el cron del hosting igual va a aplicar las migraciones)."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            --connect-timeout 10 --max-time 20 \
            --retry 1 --retry-delay 5 --retry-all-errors \
            -H "X-Migrate-Token: ${{ secrets.MIGRATE_TOKEN }}" \
            "${{ vars.APP_URL }}/db/migrate.php"
