name: Deploy rad

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-rad
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/public_html/rad/' }}
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config/config.local.php
            **/README.md
            app/models/constantes.php

      - name: Run DB migrations
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then
            echo "::error::Falta la variable de repo APP_URL (Settings > Secrets and variables > Actions > Variables), ej. https://tudominio.com/rad"
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            --connect-timeout 15 --max-time 30 \
            --retry 4 --retry-delay 15 --retry-all-errors \
            -H "X-Migrate-Token: ${{ secrets.MIGRATE_TOKEN }}" \
            "${{ vars.APP_URL }}/db/migrate.php"
