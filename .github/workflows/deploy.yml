name: Deploy rad

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-rad
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/public_html/rad/' }}
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config/config.local.php
            **/README.md
            app/models/constantes.php

      # Las migraciones de base de datos las aplica un cron job en el propio
      # hosting, corriendo db/migrate.php por CLI. El hosting bloquea el
      # trafico HTTPS entrante desde las IPs de GitHub Actions (WAF/firewall
      # del proveedor), asi que no se intenta dispararlas desde aca: los
      # intentos repetidos contra un endpoint bloqueado llegaron a hacer que
      # el firewall tambien cortara la conexion FTP del deploy.
